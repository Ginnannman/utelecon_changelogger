name: utelecon changelog

on:
  schedule:
    - cron: "0 18 * * 0" # 毎週月曜 03:00 JST
  workflow_dispatch:
    inputs:
      since:
        description: "開始（JST, YYYY-MM-DD HH:MM）"
        required: true
        type: string
      until:
        description: "終了（JST, YYYY-MM-DD HH:MM）。空欄なら実行時点"
        required: false
        type: string

permissions:
  contents: read

cache-mode: none

concurrency:
  group: changelog
  queue: max

env:
  TARGET_REPO: utelecon/utelecon.github.io
  TARGET_BRANCH: master
  PUBLISH_BRANCH: main

jobs:
  resolve:
    name: 比較する2時点を決める
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      kind: ${{ steps.resolve.outputs.kind }}
      since: ${{ steps.resolve.outputs.since }}
      until: ${{ steps.resolve.outputs.until }}
      old_sha: ${{ steps.resolve.outputs.old_sha }}
      new_sha: ${{ steps.resolve.outputs.new_sha }}
      old_date: ${{ steps.resolve.outputs.old_date }}
      new_date: ${{ steps.resolve.outputs.new_date }}
      old_node: ${{ steps.resolve.outputs.old_node }}
      new_node: ${{ steps.resolve.outputs.new_node }}
      state_sha: ${{ steps.resolve.outputs.state_sha }}
      same: ${{ steps.resolve.outputs.same }}
      dir: ${{ steps.resolve.outputs.dir }}
    steps:
      - name: Require the default branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::main 以外のブランチからは実行できません（$GITHUB_REF）"
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the latest state
        env:
          STATE_FILE: ${{ runner.temp }}/state/last.json
        run: |
          git fetch --quiet --depth=1 origin "$PUBLISH_BRANCH"
          mkdir -p "$(dirname "$STATE_FILE")"
          if git cat-file -e FETCH_HEAD:state/last.json 2>/dev/null; then
            git show FETCH_HEAD:state/last.json > "$STATE_FILE"
          fi

      - id: resolve
        env:
          EVENT: ${{ github.event_name }}
          IN_SINCE: ${{ inputs.since }}
          IN_UNTIL: ${{ inputs.until }}
          STATE_FILE: ${{ runner.temp }}/state/last.json
        run: bash scripts/resolve.sh

  build:
    name: ビルドとスナップショット（${{ matrix.side }}）
    needs: resolve
    if: needs.resolve.outputs.same != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        side: [old, new]
    env:
      SHA: ${{ matrix.side == 'old' && needs.resolve.outputs.old_sha || needs.resolve.outputs.new_sha }}
      NODE_MAJOR: ${{ matrix.side == 'old' && needs.resolve.outputs.old_node || needs.resolve.outputs.new_node }}
      COMMITTED_AT: ${{ matrix.side == 'old' && needs.resolve.outputs.old_date || needs.resolve.outputs.new_date }}
    steps:
      - name: Checkout tool
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tool
          persist-credentials: false

      - name: Checkout target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.SHA }}
          path: target
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_MAJOR }}
          package-manager-cache: false

      - name: Install tool
        working-directory: tool
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Build target
        working-directory: target
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Snapshot
        run: >-
          node tool/scripts/snapshot.mjs
          --dist target/dist --source target --out snapshot/snap.json.gz
          --sha "$SHA" --committed-at "$COMMITTED_AT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: snapshot-${{ matrix.side }}
          path: snapshot/snap.json.gz
          retention-days: 7
          if-no-files-found: error

  report:
    name: 比較して記録する
    needs: [resolve, build]
    if: >-
      ${{ !cancelled()
          && github.ref == 'refs/heads/main'
          && needs.resolve.result == 'success'
          && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # reports/ と state/ の push
    env:
      KIND: ${{ needs.resolve.outputs.kind }}
      SINCE: ${{ needs.resolve.outputs.since }}
      UNTIL: ${{ needs.resolve.outputs.until }}
      OLD_SHA: ${{ needs.resolve.outputs.old_sha }}
      NEW_SHA: ${{ needs.resolve.outputs.new_sha }}
      OLD_DATE: ${{ needs.resolve.outputs.old_date }}
      NEW_DATE: ${{ needs.resolve.outputs.new_date }}
      STATE_SHA: ${{ needs.resolve.outputs.state_sha }}
      SAME: ${{ needs.resolve.outputs.same }}
      DIR: ${{ needs.resolve.outputs.dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          package-manager-cache: false

      - run: npm ci --no-audit --no-fund --ignore-scripts

      - if: env.SAME != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: snapshot-old
          path: ${{ runner.temp }}/snapshots/old

      - if: env.SAME != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: snapshot-new
          path: ${{ runner.temp }}/snapshots/new

      - name: Compare
        env:
          SNAPSHOTS: ${{ runner.temp }}/snapshots
          REPORT_SRC: ${{ runner.temp }}/report
        run: |
          args=(--out "$REPORT_SRC" --summary "$GITHUB_STEP_SUMMARY"
                --kind "$KIND" --since "$SINCE" --until "$UNTIL"
                --old-sha "$OLD_SHA" --new-sha "$NEW_SHA" --old-date "$OLD_DATE" --new-date "$NEW_DATE"
                --repo "$TARGET_REPO" --tool-sha "$GITHUB_SHA")
          if [ "$SAME" != "true" ]; then
            args+=(--old "$SNAPSHOTS/old/snap.json.gz" --new "$SNAPSHOTS/new/snap.json.gz")
          fi
          node scripts/compare.mjs "${args[@]}"

      - name: Publish
        env:
          REPORT_SRC: ${{ runner.temp }}/report
          BRANCH: ${{ env.PUBLISH_BRANCH }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish.sh
