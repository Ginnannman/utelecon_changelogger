# 依存の更新を週1回 PR として提案させる（取り込みは手動で確認してから行う）
# cooldown: 公開から7日経っていない版は提案しない（公開直後に差し替えられた悪性の版を避ける）
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
